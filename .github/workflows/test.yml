name: Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: macos-26-intel
          - os: macos-26
          - os: windows-latest
    steps:
      - name: Checkout ${{ github.event.repository.name }}
        uses: actions/checkout@v4

      - name: Setup MSVC
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Setup V
        uses: vlang/setup-v@v1.7
        with:
          version-file: .v-version

      - name: Cache Windows vcpkg packages
        if: matrix.os == 'windows-latest'
        uses: actions/cache@v4
        with:
          path: .cache/vcpkg-binary-cache
          key: windows-vcpkg-openssl-x64-v1-${{ hashFiles('.github/workflows/test.yml') }}
          restore-keys: |
            windows-vcpkg-openssl-x64-v1-

      - name: Install Windows OpenSSL SDK
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\.cache\vcpkg-binary-cache" | Out-Null
          $env:VCPKG_DEFAULT_BINARY_CACHE = "$env:GITHUB_WORKSPACE\.cache\vcpkg-binary-cache"
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg"
          git clone --depth 1 https://github.com/microsoft/vcpkg $vcpkgRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $vcpkgRoot "bootstrap-vcpkg.bat") -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $triplet = "x64-windows"
          & (Join-Path $vcpkgRoot "vcpkg.exe") install openssl:$triplet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sdkRoot = Join-Path $vcpkgRoot "installed\$triplet"
          $opensslLibDir = Join-Path $sdkRoot "lib"
          $cryptoImportLib = Get-ChildItem -Path $opensslLibDir -Include libcrypto.lib, crypto.lib -File -Recurse | Select-Object -First 1
          $sslImportLib = Get-ChildItem -Path $opensslLibDir -Include libssl.lib, ssl.lib -File -Recurse | Select-Object -First 1
          if ($null -eq $cryptoImportLib) { throw "OpenSSL crypto import library not found under $sdkRoot" }
          if ($null -eq $sslImportLib) { throw "OpenSSL ssl import library not found under $sdkRoot" }
          foreach ($alias in @("crypto.lib", "libcrypto.lib")) {
            $aliasPath = Join-Path $opensslLibDir $alias
            if ($cryptoImportLib.FullName -ne $aliasPath) {
              Copy-Item -Force $cryptoImportLib.FullName $aliasPath
            }
          }
          foreach ($alias in @("ssl.lib", "libssl.lib")) {
            $aliasPath = Join-Path $opensslLibDir $alias
            if ($sslImportLib.FullName -ne $aliasPath) {
              Copy-Item -Force $sslImportLib.FullName $aliasPath
            }
          }
          Add-Content -Path $env:GITHUB_ENV -Value "INCLUDE=$(Join-Path $sdkRoot 'include');$env:INCLUDE"
          Add-Content -Path $env:GITHUB_ENV -Value "LIB=$opensslLibDir;$env:LIB"
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $sdkRoot "bin")

      - name: Prepare Ubuntu OpenSSL
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev

      - name: Prepare macOS SQLite
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          brew install sqlite
          sqlite_prefix="$(brew --prefix sqlite)"
          echo "PKG_CONFIG_PATH=${sqlite_prefix}/lib/pkgconfig${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}" >> "$GITHUB_ENV"

      - name: Ensure quickjs-ng checkout
        id: quickjs
        shell: bash
        run: ./.github/scripts/ensure-quickjs.sh

      - name: Build QuickJS static library on Windows
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $buildRoot = Join-Path $env:RUNNER_TEMP "vjsx-quickjs-ng-build"
          $cygpath = "C:\Program Files\Git\usr\bin\cygpath.exe"
          $quickjsSource = (& $cygpath -w "${{ steps.quickjs.outputs.quickjs_dir }}").Trim()
          cmake -S $quickjsSource -B $buildRoot -G Ninja -DCMAKE_BUILD_TYPE=Release -DQJS_BUILD_LIBC=ON -DBUILD_SHARED_LIBS=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $buildRoot --target qjs_exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $qjsLib = Get-ChildItem -Path $buildRoot -Filter qjs.lib -File -Recurse | Select-Object -First 1
          if ($null -eq $qjsLib) { throw "qjs.lib not found under $buildRoot" }
          Add-Content -Path $env:GITHUB_ENV -Value "VJS_QUICKJS_PATH=$quickjsSource"
          Add-Content -Path $env:GITHUB_ENV -Value "VJS_QUICKJS_LIB_PATH=$($qjsLib.FullName)"
          Add-Content -Path $env:GITHUB_ENV -Value "VJS_V_CC=msvc"

      - name: Build QuickJS static library on Unix
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          build_root="$RUNNER_TEMP/vjsx-quickjs-ng-build"
          cmake -S "${{ steps.quickjs.outputs.quickjs_dir }}" -B "$build_root" \
            -DCMAKE_BUILD_TYPE=Release -DQJS_BUILD_LIBC=ON -DBUILD_SHARED_LIBS=OFF
          cmake --build "$build_root" --target qjs_exe
          qjs_lib="$(find "$build_root" -name libqjs.a -print -quit)"
          if [ -z "$qjs_lib" ]; then
            echo "libqjs.a not found under $build_root" >&2
            exit 1
          fi
          echo "VJS_QUICKJS_PATH=${{ steps.quickjs.outputs.quickjs_dir }}" >> "$GITHUB_ENV"
          echo "VJS_QUICKJS_LIB_PATH=$qjs_lib" >> "$GITHUB_ENV"
          echo "VJS_V_CC=clang" >> "$GITHUB_ENV"

      - name: Verify fmt
        run: |
          v fmt -diff .
          v fmt -verify .

      - name: Run Tests on Unix
        if: matrix.os != 'windows-latest'
        shell: bash
        run: v -d link_quickjs -d use_openssl -cg -cc clang test .

      - name: Run Tests Windows with MSVC
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: v -d link_quickjs -d use_openssl -cg -cc msvc test .
