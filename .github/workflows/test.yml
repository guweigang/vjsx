name: Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive_path: libs/qjs_linux_x64.a
          - os: ubuntu-24.04-arm
            archive_path: libs/qjs_linux_arm64.a
          - os: macos-26-intel
            archive_path: libs/qjs_macos_x64.a
          - os: macos-15
            archive_path: libs/qjs_macos_arm64.a
          - os: windows-latest
            archive_path: libs/qjs_win_x64.a
    steps:
      - name: Checkout ${{ github.event.repository.name }}
        uses: actions/checkout@v4

      - name: Setup V
        uses: vlang/setup-v@v1.7
        with:
          version-file: .v-version

      - name: Prepare Windows x64
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          & C:\msys64\usr\bin\bash.exe -lc "pacman --noconfirm -S --needed mingw-w64-x86_64-openssl"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Prepare Ubuntu OpenSSL
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev

      - name: Check bundled archive
        id: archive
        shell: bash
        run: |
          if [ -f "${{ matrix.archive_path }}" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure quickjs-ng checkout
        if: steps.archive.outputs.exists != 'true'
        id: quickjs
        shell: bash
        run: ./.github/scripts/ensure-quickjs.sh

      - name: Verify fmt
        run: |
          v fmt -diff .
          v fmt -verify .

      - name: Run Tests Linux and Mac with bundled archive
        if: steps.archive.outputs.exists == 'true' && matrix.os != 'windows-latest'
        run: v -d use_openssl -cg -cc clang test .

      - name: Run Tests Linux and Mac with local quickjs-ng source
        if: steps.archive.outputs.exists != 'true' && matrix.os != 'windows-latest'
        shell: bash
        run: VJS_QUICKJS_PATH="${{ steps.quickjs.outputs.quickjs_dir }}" v -d build_quickjs -d use_openssl -cg -cc clang test .

      - name: Run Tests Windows with bundled archive
        if: steps.archive.outputs.exists == 'true' && matrix.os == 'windows-latest'
        run: v -d use_openssl -cg -cc gcc test .

      - name: Run Tests Windows with local quickjs-ng source
        if: steps.archive.outputs.exists != 'true' && matrix.os == 'windows-latest'
        shell: bash
        run: VJS_QUICKJS_PATH="${{ steps.quickjs.outputs.quickjs_dir }}" v -d build_quickjs -d use_openssl -cg -cc gcc test .
