name: Release Binaries

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish GitHub release
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  VCPKG_BINARY_CACHE_DIR: ${{ github.workspace }}\.cache\vcpkg-binary-cache

jobs:
  metadata:
    name: Read release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vmod.outputs.version }}
      tag: ${{ steps.vmod.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from v.mod
        id: vmod
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE "s/^[[:space:]]*version:[[:space:]]*'([^']+)'.*/\1/p" v.mod | head -n 1)"
          if [ -z "$version" ]; then
            echo "failed to read version from v.mod" >&2
            exit 1
          fi
          tag="v${version}"
          if [[ "${GITHUB_REF}" == refs/tags/* && "${GITHUB_REF_NAME}" != "$tag" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match v.mod version ${tag}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.artifact }}
    needs: metadata
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: vjsx-linux-x64
            binary: vjsx
            archive: vjsx-linux-x64.tar.gz
            shell: bash
          - os: ubuntu-24.04-arm
            artifact: vjsx-linux-arm64
            binary: vjsx
            archive: vjsx-linux-arm64.tar.gz
            shell: bash
          - os: macos-26-intel
            artifact: vjsx-darwin-x64
            binary: vjsx
            archive: vjsx-darwin-x64.tar.gz
            shell: bash
          - os: macos-26
            artifact: vjsx-darwin-arm64
            binary: vjsx
            archive: vjsx-darwin-arm64.tar.gz
            shell: bash
          - os: windows-latest
            artifact: vjsx-windows-x64
            binary: vjsx.exe
            archive: vjsx-windows-x64.zip
            shell: powershell

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        if: matrix.shell == 'powershell'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Setup V
        uses: vlang/setup-v@v1.7
        with:
          version-file: .v-version

      - name: Cache Windows vcpkg packages
        if: matrix.shell == 'powershell'
        uses: actions/cache@v4
        with:
          path: .cache/vcpkg-binary-cache
          key: windows-vcpkg-openssl-x64-v1-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: |
            windows-vcpkg-openssl-x64-v1-

      - name: Install Windows OpenSSL SDK
        if: matrix.shell == 'powershell'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "$env:VCPKG_BINARY_CACHE_DIR" | Out-Null
          $env:VCPKG_DEFAULT_BINARY_CACHE = "$env:VCPKG_BINARY_CACHE_DIR"
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_DEFAULT_BINARY_CACHE=$env:VCPKG_BINARY_CACHE_DIR"
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg"
          git clone --depth 1 https://github.com/microsoft/vcpkg $vcpkgRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $vcpkgRoot "bootstrap-vcpkg.bat") -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $triplet = "x64-windows"
          & (Join-Path $vcpkgRoot "vcpkg.exe") install openssl:$triplet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sdkRoot = Join-Path $vcpkgRoot "installed\$triplet"
          $opensslLibDir = Join-Path $sdkRoot "lib"
          $cryptoImportLib = Get-ChildItem -Path $opensslLibDir -Include libcrypto.lib, crypto.lib -File -Recurse | Select-Object -First 1
          $sslImportLib = Get-ChildItem -Path $opensslLibDir -Include libssl.lib, ssl.lib -File -Recurse | Select-Object -First 1
          if ($null -eq $cryptoImportLib) { throw "OpenSSL crypto import library not found under $sdkRoot" }
          if ($null -eq $sslImportLib) { throw "OpenSSL ssl import library not found under $sdkRoot" }
          foreach ($alias in @("crypto.lib", "libcrypto.lib")) {
            $aliasPath = Join-Path $opensslLibDir $alias
            if ($cryptoImportLib.FullName -ne $aliasPath) {
              Copy-Item -Force $cryptoImportLib.FullName $aliasPath
            }
          }
          foreach ($alias in @("ssl.lib", "libssl.lib")) {
            $aliasPath = Join-Path $opensslLibDir $alias
            if ($sslImportLib.FullName -ne $aliasPath) {
              Copy-Item -Force $sslImportLib.FullName $aliasPath
            }
          }
          Add-Content -Path $env:GITHUB_ENV -Value "OPENSSL_ROOT_DIR=$sdkRoot"
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_INSTALLED_DIR=$sdkRoot"
          Add-Content -Path $env:GITHUB_ENV -Value "INCLUDE=$(Join-Path $sdkRoot 'include');$env:INCLUDE"
          Add-Content -Path $env:GITHUB_ENV -Value "LIBRARY_PATH=$opensslLibDir;$env:LIBRARY_PATH"
          Add-Content -Path $env:GITHUB_ENV -Value "LIB=$opensslLibDir;$env:LIB"
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $sdkRoot "bin")

      - name: Setup Unix OpenSSL SDK
        if: matrix.shell == 'bash' && startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev

      - name: Build Unix binary
        if: matrix.shell == 'bash'
        shell: bash
        run: |
          VJS_REQUIRE_STATIC_CRYPTO=1 VJS_OUT="$PWD/dist/${{ matrix.binary }}" ./scripts/build-vjsx.sh

      - name: Build Windows binary
        if: matrix.shell == 'powershell'
        shell: powershell
        run: |
          .\scripts\build-vjsx.ps1 -Out "$PWD\dist\${{ matrix.binary }}"

      - name: Stage Windows runtime DLLs
        if: matrix.shell == 'powershell'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $vcpkgBin = Join-Path $env:VCPKG_INSTALLED_DIR "bin"
          foreach ($pattern in @("libcrypto-*.dll", "libssl-*.dll")) {
            Get-ChildItem -Path $vcpkgBin -Filter $pattern -File | ForEach-Object {
              Copy-Item -Force $_.FullName "dist\"
              Write-Host "staged $($_.Name)"
            }
          }

      - name: Smoke Unix binary
        if: matrix.shell == 'bash'
        shell: bash
        run: |
          if [ "$(uname -s)" = "Darwin" ] && command -v otool >/dev/null 2>&1; then
            if otool -L "./dist/${{ matrix.binary }}" | grep -q 'libcrypto.*dylib'; then
              echo "Error: ./dist/${{ matrix.binary }} has unexpected dynamic dependency on libcrypto" >&2
              otool -L "./dist/${{ matrix.binary }}"
              exit 1
            fi
          fi
          ./dist/${{ matrix.binary }} check-runtime --runtime node
          test "$(./dist/${{ matrix.binary }} --version)" = "vjsx ${{ needs.metadata.outputs.version }}"
          ./dist/${{ matrix.binary }} ./tests/test.js
          ./dist/${{ matrix.binary }} --runtime browser --module ./examples/webcrypto/signatures.mjs | grep -Eq '^ECDSA:(70|71|72):true$'
          ./dist/${{ matrix.binary }} build ./tests/test.js -o ./dist/vjsx-smoke-app
          ./dist/vjsx-smoke-app


      - name: Smoke Windows binary
        if: matrix.shell == 'powershell'
        shell: powershell
        run: |
          .\dist\${{ matrix.binary }} check-runtime --runtime node
          if ((.\dist\${{ matrix.binary }} --version).Trim() -ne "vjsx ${{ needs.metadata.outputs.version }}") { throw "binary version does not match v.mod" }
          .\dist\${{ matrix.binary }} .\tests\test.js
          $signatureOutput = .\dist\${{ matrix.binary }} --runtime browser --module .\examples\webcrypto\signatures.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (($signatureOutput | Select-Object -Last 1) -notmatch '^ECDSA:(70|71|72):true$') { throw "WebCrypto ECDSA smoke failed: $signatureOutput" }
          .\dist\${{ matrix.binary }} build .\tests\test.js -o .\dist\vjsx-smoke-app.exe
          .\dist\vjsx-smoke-app.exe

      - name: Package Unix archive
        if: matrix.shell == 'bash'
        shell: bash
        run: |
          mkdir -p "release/${{ matrix.artifact }}"
          cp "dist/${{ matrix.binary }}" "release/${{ matrix.artifact }}/"
          cp README.md "release/${{ matrix.artifact }}/"
          tar -C release -czf "${{ matrix.archive }}" "${{ matrix.artifact }}"

      - name: Package Windows archive
        if: matrix.shell == 'powershell'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "release\${{ matrix.artifact }}" | Out-Null
          Copy-Item "dist\${{ matrix.binary }}" "release\${{ matrix.artifact }}\"
          Copy-Item "dist\*.dll" "release\${{ matrix.artifact }}\"
          Copy-Item "README.md" "release\${{ matrix.artifact }}\"
          Compress-Archive -Path "release\${{ matrix.artifact }}" -DestinationPath "${{ matrix.archive }}" -Force

      - name: Smoke packaged Unix archive
        if: matrix.shell == 'bash'
        shell: bash
        run: |
          mkdir -p packaged-smoke
          tar -xzf "${{ matrix.archive }}" -C packaged-smoke
          test "$(packaged-smoke/${{ matrix.artifact }}/${{ matrix.binary }} --version)" = "vjsx ${{ needs.metadata.outputs.version }}"
          packaged-smoke/${{ matrix.artifact }}/${{ matrix.binary }} check-runtime --runtime node

      - name: Smoke packaged Windows archive
        if: matrix.shell == 'powershell'
        shell: powershell
        run: |
          Expand-Archive -Path "${{ matrix.archive }}" -DestinationPath "packaged-smoke" -Force
          $packagedBinary = "packaged-smoke\${{ matrix.artifact }}\${{ matrix.binary }}"
          if ((& $packagedBinary --version).Trim() -ne "vjsx ${{ needs.metadata.outputs.version }}") { throw "packaged binary version does not match v.mod" }
          & $packagedBinary check-runtime --runtime node
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  benchmark:
    name: Record release benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup V
        uses: vlang/setup-v@v1.7
        with:
          version-file: .v-version

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev

      - name: Ensure quickjs-ng checkout
        id: quickjs
        shell: bash
        run: ./.github/scripts/ensure-quickjs.sh

      - name: Build QuickJS static library
        shell: bash
        run: |
          set -euo pipefail
          build_root="$RUNNER_TEMP/vjsx-quickjs-ng-benchmark"
          cmake -S "${{ steps.quickjs.outputs.quickjs_dir }}" -B "$build_root" \
            -DCMAKE_BUILD_TYPE=Release -DQJS_BUILD_LIBC=ON -DBUILD_SHARED_LIBS=OFF
          cmake --build "$build_root" --target qjs_exe
          qjs_lib="$(find "$build_root" -name libqjs.a -print -quit)"
          test -n "$qjs_lib"
          echo "VJS_QUICKJS_PATH=${{ steps.quickjs.outputs.quickjs_dir }}" >> "$GITHUB_ENV"
          echo "VJS_QUICKJS_LIB_PATH=$qjs_lib" >> "$GITHUB_ENV"

      - name: Run benchmark and record environment
        shell: bash
        run: |
          {
            echo "commit=${GITHUB_SHA}"
            echo "v_version=$(cat .v-version)"
            echo "quickjs_version=$(cat .quickjs-version)"
            echo "runner_image=${ImageOS:-unknown}-${ImageVersion:-unknown}"
            echo "architecture=$(uname -m)"
            echo "compiler=$(clang --version | head -n 1)"
            lscpu | grep -E '^(Model name|CPU\(s\)):' || true
          } | tee release-benchmark.txt
          VJSX_BENCH_ITERATIONS=25 \
            v -prod -d link_quickjs -d use_openssl -cc clang \
            run benchmarks/release_benchmark.v | tee -a release-benchmark.txt

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-benchmark
          path: release-benchmark.txt
          if-no-files-found: error

  assemble:
    name: Assemble and attest release
    needs:
      - metadata
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Generate release checksums
        shell: bash
        run: |
          cd release-artifacts
          find . -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec sha256sum {} + | sort -k2 > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 5

      - name: Generate signed build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            release-artifacts/**/*.tar.gz
            release-artifacts/**/*.zip
            release-artifacts/SHA256SUMS

      - name: Upload assembled release
        uses: actions/upload-artifact@v4
        with:
          name: vjsx-release
          path: |
            release-artifacts/**/*.tar.gz
            release-artifacts/**/*.zip
            release-artifacts/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Publish ${{ needs.metadata.outputs.tag }}
    needs:
      - metadata
      - benchmark
      - assemble
    if: github.event_name != 'workflow_dispatch' || inputs.publish_release
    runs-on: ubuntu-latest
    steps:
      - name: Download assembled release
        uses: actions/download-artifact@v4
        with:
          name: vjsx-release
          path: release-artifacts

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          name: ${{ needs.metadata.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: |
            vjsx ${{ needs.metadata.outputs.version }}

            Built from GitHub Actions run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            - [API stability contract](https://github.com/${{ github.repository }}/blob/${{ needs.metadata.outputs.tag }}/docs/API_STABILITY.md)
            - [Upgrade and migration guidance](https://github.com/${{ github.repository }}/blob/${{ needs.metadata.outputs.tag }}/docs/UPGRADING.md)
            - [Security policy and boundaries](https://github.com/${{ github.repository }}/blob/${{ needs.metadata.outputs.tag }}/SECURITY.md)
            - [Platform support matrix](https://github.com/${{ github.repository }}/blob/${{ needs.metadata.outputs.tag }}/docs/SUPPORT_MATRIX.md)
          prerelease: ${{ contains(needs.metadata.outputs.version, '-') }}
          files: |
            release-artifacts/**/*.tar.gz
            release-artifacts/**/*.zip
            release-artifacts/SHA256SUMS
          fail_on_unmatched_files: true
